<html>
    <head>
        <title>TextCopier</title>
        <link rel="stylesheet" href="assets/vendor/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <style>
            body {
                width: 150px;
                text-align: center;
            }

            #resultsDiv {
                height: 200px;
            }
        </style>
    </head>
    <body>
        <p class="text-danger mt-2 mb-0" id="warning" style="display: none;"><small>Remember to close this window before you leave</small></p>
        <div class="p-3">
            <button id="capture" type="button" class="btn btn-primary">Capture</button>
        </div>
        <div id="resultsDiv" class="border border-secondary-subtle rounded w-75 m-auto p-2" style="display: none;">
            <div class="d-flex flex-row border-bottom pb-1">
                <div style="width: 75%;">
                    <!-- Empty div to push the button to the edge -->
                </div>
                <button id="copy" style="width: 25%; border: none; background-color: rgba(240, 248, 255, 0.014);"><i class="fa fa-copy"></i></button>
            </div>
            <p id="result" class="mt-2"></p>
        </div>
        <script src="popup.js"></script>
        <script src="assets/vendor/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
